<div id="galgame-pipeline-v3" aria-label="虚构作品风停之前的本地化流程演示">
  <div class="viz-row">
    <span>《风停之前》</span><span class="text-small text-muted">虚构作品 · 9 条原文 · 两条分支</span>
  </div>
  <div class="viz-controls gp-controls">
    <button type="button" class="btn" data-action="previous" disabled>上一步</button>
    <button type="button" class="btn btn-primary" data-action="next">下一步</button>
    <span data-step class="tabular-nums" aria-live="polite">1 / 10 · 保护原版</span>
  </div>
  <div class="progress" role="progressbar" aria-label="演示步骤" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"><div class="progress-bar" style="width:10%"></div></div>
  <svg class="gp-diagram" role="img" aria-labelledby="gp-title gp-desc"><title id="gp-title">保护原版</title><desc id="gp-desc">原始游戏保持只读，在独立工作区处理副本，并记录准确版本与文件摘要。</desc></svg>
  <div class="text-small" data-detail aria-live="polite">原版只读；每个生成物都能追溯到准确游戏版本。</div>
</div>
<style>
#galgame-pipeline-v3 { width:100%; color:var(--foreground); }
#galgame-pipeline-v3 .gp-controls { margin-top:16px; margin-bottom:12px; }
#galgame-pipeline-v3 .gp-diagram { display:block; width:100%; overflow:visible; margin:8px 0; }
#galgame-pipeline-v3 .gp-label { fill:var(--foreground); font-weight:500; }
#galgame-pipeline-v3 .gp-value { fill:var(--foreground); font-weight:400; }
#galgame-pipeline-v3 .gp-link { fill:none; stroke:var(--border); stroke-width:1.5; }
#galgame-pipeline-v3 .gp-node { fill:var(--muted); stroke:none; }
#galgame-pipeline-v3 .gp-node.active { fill:color-mix(in srgb, var(--viz-series-1) 15%, transparent); }
#galgame-pipeline-v3 .gp-node.rework { fill:color-mix(in srgb, var(--viz-series-2) 15%, transparent); }
#galgame-pipeline-v3 [data-detail] { min-height:2em; }
</style>
<script>
(() => {
  const root = document.getElementById('galgame-pipeline-v3');
  const svg = root.querySelector('.gp-diagram');
  const previous = root.querySelector('[data-action="previous"]');
  const next = root.querySelector('[data-action="next"]');
  const counter = root.querySelector('[data-step]');
  const detail = root.querySelector('[data-detail]');
  const progress = root.querySelector('[role="progressbar"]');
  const ns = 'http://www.w3.org/2000/svg';
  const steps = [
    {name:'保护原版', desc:'确定游戏版本与引擎，在独立工作区创建处理副本。原始目录只读。', detail:'原版只读；每个生成物都能追溯到准确游戏版本。', rows:[
      [{name:'原始游戏目录', lines:['脚本包 · 字体 · 配置 · 语音', '只读保存 + 文件摘要']}],
      [{name:'独立工作区', lines:['提取产物 / 翻译 / 审校 / 构建', '版本与引擎特征记录'], tone:'active'}]
    ]},
    {name:'研究与空改往返', desc:'并行研究引擎格式、原作设定和中文术语。先证明不改文本也能提取、回填、封包和启动。', detail:'正式全量翻译前，先证明目标版本能完成无修改往返。', rows:[
      [{name:'研究三条线', lines:['引擎：解包、编码、控制指令', '原作：人物关系、时间线、路线', '中文：已有译名、称谓与文体']}],
      [{name:'技术门禁', lines:['解包 → 提取 → 原样回填', '封包 → 启动验证'], tone:'active'}]
    ]},
    {name:'结构化提取', desc:'将日文文本拆成有稳定身份的可翻译单元，并保护控制指令；按 ID 回填。', detail:'翻译改文本；ID、顺序、控制符继续承担回填定位。', rows:[
      [{name:'日文脚本 · 美咲', lines:['あの約束、まだ覚えてる？[wait]']}],
      [{name:'模型需要的内容', lines:['ID：s0:000000', '说话人：美咲', '原文 + [wait]'], tone:'active'},
       {name:'机器保管的结构', lines:['原文件 / 顺序 / 场景', '原文摘要 / 路线', '受保护指令清单']}]
    ]},
    {name:'冻结翻译资料', desc:'冻结已确认的人设、口吻、术语和知识门；待定提案与来源日志保留在权威库。', detail:'先统一解释与口吻；资料按批准的语义依赖范围加载。', rows:[
      [{name:'生效资料快照 P1', lines:['美咲：温和、欲言又止；玲：直率', '約束 → 约定', '知识门：玲尚不知道约定的内容'], tone:'active'}],
      [{name:'进入模型上下文', lines:['翻译契约 + 必要资料', '批准译例 + 生效决策']},
       {name:'保留在权威库', lines:['来源链接 + 检索记录', '待定术语提案']}]
    ]},
    {name:'按完整场景派发', desc:'公共段和两条分支各为独立任务。协调者确定边界，每条原文只有一个拥有者。', detail:'场景是审校单位；分块是执行单位，重叠原文只读。', rows:[
      [{name:'公共段 · job-0000', lines:['3 条原文 · 1 个主译任务', '公共段后分支'], tone:'active'}],
      [{name:'美咲线 · job-0001', lines:['3 条原文', '独立初译 → 独立审校']},
       {name:'玲线 · job-0002', lines:['3 条原文', '独立初译 → 独立审校']}]
    ]},
    {name:'预算与缓存', desc:'每次请求包括冻结资料、任务正文、邻接原文和已有历史；输入和输出都要预留空间。真实缓存命中需要逐请求 usage。', detail:'缓存命中仍占上下文；文件哈希相同不等于模型请求命中。', rows:[
      [{name:'每次请求的预算', lines:['冻结资料 + 本批原文 + 必要邻接', '工具 / 指令 / 既有历史', '另留译文输出空间'], tone:'active'}],
      [{name:'压力测试 · 已运行', lines:['2 万条「え？」', '40,000 字符 → 164 块', 'UTF-8 字节规划估算']},
       {name:'缓存观测', lines:['尽量保持实际前缀稳定', '逐请求记录缓存读 / 写', '本次真实命中率：未知']}]
    ]},
    {name:'初译与独立审校', desc:'独立审校覆盖所有原文，只输出需要修改的条目。这里的否定结构需要纠正，控制标记保持不变。', detail:'试跑已审校 9 / 9 条，输出 2 条修订，其余 7 条保留。', rows:[
      [{name:'原文 · 美咲线', lines:['忘れたわけじゃない。', 'ただ、言えなかった。[wait]']}],
      [{name:'初稿 · 否定误译', lines:['我已经忘记了。', '只是，一直说不出口。[wait]'], tone:'rework'},
       {name:'审校修订', lines:['并不是忘了。', '只是，没能说出口。[wait]'], tone:'active'}]
    ]},
    {name:'变化后只返工相关任务', desc:'假设玲线专用术语变化，依赖审计只要求玲线重新处理。其他任务继续绑定原有冻结快照。', detail:'示例变更仅限玲线；全局规则变化仍可能影响所有任务。', rows:[
      [{name:'玲线专用术语更新', lines:['新资料 P2 · 已批准作用域', '比较语义依赖，保留旧快照'], tone:'rework'}],
      [{name:'可复用', lines:['公共段 job-0000', '美咲线 job-0001', '继续绑定旧快照 P1']},
       {name:'需要重新处理', lines:['玲线 job-0002', '修订 → 重审 → 新批准稿'], tone:'rework'}]
    ]},
    {name:'合并与全局检查', desc:'只合并清单中已批准的任务，核对审校声明、物化收据、原文和译文摘要，再执行全局检查。', detail:'当前内容必须匹配 QA 输入摘要；历史通过记录不能替新稿放行。', rows:[
      [{name:'批准清单', lines:['3 个任务的批准稿', '独立审校声明 + 内容摘要', '历史备份不参与合并']}],
      [{name:'最终翻译 JSONL', lines:['9 / 9 条 · 按原文顺序', 'ID / 控制符 / 术语 / 漏译检查'], tone:'active'}]
    ]},
    {name:'实机验证与补丁', desc:'按 ID 回填，重新封包，在真实游戏里验证字体、分支、存读档与安装。演示尚未执行真实游戏验证。', detail:'本演示完成到文本试跑；真实封包与实机验收仍是交付条件。', rows:[
      [{name:'回填 → 封包 → 实机', lines:['静态字形覆盖 + 实际字体加载', '正文 / 人名框 / 选项 / 历史', '设置 / 存档标题；新旧配置']}],
      [{name:'发布门禁 · 待真实游戏验证', lines:['路线与存读档测试 · 安装测试', '全部通过 → 补丁 + 构建清单', '本演示未生成可发布游戏补丁'], tone:'active'}]
    ]}
  ];
  let current = 0;
  let lastWidth = 0;
  const make = (name, attrs, text) => {
    const el = document.createElementNS(ns, name);
    Object.entries(attrs || {}).forEach(([key,value]) => el.setAttribute(key, value));
    if (text !== undefined) el.textContent = text;
    return el;
  };
  function draw() {
    const width = Math.max(280, Math.floor(root.getBoundingClientRect().width));
    const step = steps[current];
    svg.replaceChildren(make('title', {id:'gp-title'}, step.name), make('desc', {id:'gp-desc'}, step.desc));
    const measure = make('text', {class:'gp-value', visibility:'hidden'});
    svg.append(measure);
    const wrap = (value, maxWidth) => {
      const lines = [];
      let line = '';
      for (const char of value) {
        measure.textContent = line + char;
        if (line && measure.getComputedTextLength() > maxWidth) { lines.push(line); line = char; }
        else line += char;
      }
      if (line) lines.push(line);
      return lines;
    };
    let y = 14;
    const placed = [];
    step.rows.forEach((row) => {
      const gap = 16;
      const nodeWidth = (width - 8 - gap * (row.length - 1)) / row.length;
      const nodes = row.map((node,index) => {
        const title = wrap(node.name, nodeWidth-24);
        const lines = node.lines.flatMap(line => wrap(line, nodeWidth-24));
        return {...node, x:4+index*(nodeWidth+gap), y, width:nodeWidth, title, lines, height:24+title.length*22+lines.length*22};
      });
      const height = Math.max(...nodes.map(node=>node.height));
      nodes.forEach(node => node.height=height);
      placed.push(nodes);
      y += height + 42;
    });
    measure.remove();
    for(let row=1;row<placed.length;row++) {
      placed[row-1].forEach(from => placed[row].forEach(to => {
        const x1=from.x+from.width/2, y1=from.y+from.height, x2=to.x+to.width/2, y2=to.y;
        const middle=(y1+y2)/2;
        svg.append(make('path',{class:'gp-link',d:`M${x1},${y1} V${middle} H${x2} V${y2-6}`}));
        svg.append(make('path',{class:'gp-link',d:`M${x2-4},${y2-10} L${x2},${y2-6} L${x2+4},${y2-10}`}));
      }));
    }
    placed.flat().forEach(node => {
      svg.append(make('rect',{class:`gp-node ${node.tone||''}`,x:node.x,y:node.y,width:node.width,height:node.height,rx:6}));
      let textY=node.y+25;
      node.title.forEach(line=>{svg.append(make('text',{class:'gp-label',x:node.x+12,y:textY},line));textY+=22;});
      textY+=2;
      node.lines.forEach(line=>{svg.append(make('text',{class:'gp-value',x:node.x+12,y:textY},line));textY+=22;});
    });
    svg.setAttribute('viewBox',`0 0 ${width} ${y-30}`);
    svg.setAttribute('height', y-30);
    previous.disabled=current===0;
    next.disabled=current===steps.length-1;
    counter.textContent=`${current+1} / ${steps.length} · ${step.name}`;
    detail.textContent=step.detail;
    progress.setAttribute('aria-valuenow',current+1);
    progress.firstElementChild.style.width=`${(current+1)/steps.length*100}%`;
  }
  previous.addEventListener('click',()=>{if(current>0){current--;draw();}});
  next.addEventListener('click',()=>{if(current<steps.length-1){current++;draw();}});
  new ResizeObserver(()=>{const width=root.getBoundingClientRect().width;if(width!==lastWidth){lastWidth=width;draw();}}).observe(root);
  draw();
})();
</script>
